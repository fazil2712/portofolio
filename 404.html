<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <style>
        body {
            font-family: 'IBM Plex Mono', monospace, sans-serif;
            background: #FAFAF7;
            color: #2D3748;
            display: flex;

            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        h1 {

            margin-bottom: 1rem;
        }
        p {
            font-family: 'IBM Plex Sans', sans-serif;
            margin-bottom: 1.5rem;
            line-height: 1.6;
            font-size: 0.95rem;
        }
        a {
            display: inline-block;
            background: #2D3748;
            color: #FAFAF7;
            padding: 0.75rem 1.5rem;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }
        a:hover {
            background: #D97706;
        }
    </style>
</head>
<body>
    <div class="error-box">
